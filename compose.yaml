name: plantbridge

services:
  source-simulator:
    build:
      context: .
      dockerfile: source-simulator/Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: plantbridge
      POSTGRES_USER: plantbridge
      POSTGRES_PASSWORD: plantbridge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/test:/db/test:ro
      - ./data/reference:/reference:ro
      - ./data/telemetry:/telemetry:ro
      - ./data/laboratory:/laboratory:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantbridge -d plantbridge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nifi:
    build:
      context: .
      dockerfile: nifi/Dockerfile
    hostname: nifi
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: plantbridge-admin
      SINGLE_USER_CREDENTIALS_PASSWORD: plantbridge_nifi_dev_2026
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 1g
    ports:
      - "8443:8443"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
    depends_on:
      postgres:
        condition: service_healthy
      source-simulator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --insecure --fail --silent https://$$(hostname):8443/nifi/ >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  nifi_conf:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_state:
