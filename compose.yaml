name: plantbridge

services:
  source-simulator:
    build:
      context: .
      dockerfile: source-simulator/Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: plantbridge
      POSTGRES_USER: plantbridge
      POSTGRES_PASSWORD: plantbridge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/test:/db/test:ro
      - ./data/reference:/reference:ro
      - ./data/telemetry:/telemetry:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantbridge -d plantbridge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
